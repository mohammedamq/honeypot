{
    "device.node_id": "opencanary-honeypot-01",
    "ip.ignorelist": [],
    "git.enabled": false,
    "ftp.enabled": false,
    "http.banner": "Apache/2.4.49",
    "http.enabled": true,
    "http.port": 8080,
    "http.skin": "nasLogin",
    "httpproxy.enabled": false,
    "httproxy.enabled": false,
    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "formatters": {
                "plain": {
                    "format": "%(message)s"
                },
                "syslog_rfc": {
                    "format": "opencanary[%(process)-5s:%(thread)d]: %(name)s %(levelname)-5s %(message)s"
                }
            },
            "handlers": {
                "console": {
                    "class": "logging.StreamHandler",
                    "stream": "ext://sys.stdout"
                },
                "file": {
                    "class": "logging.FileHandler",
                    "filename": "/var/log/opencanary/opencanary.log"
                },
                "json_file": {
                    "class": "logging.FileHandler",
                    "filename": "/var/log/opencanary/opencanary.json",
                    "formatter": "plain"
                }
            }
        }
    },
    "portscan.enabled": true,
    "portscan.synrate": 5,
    "portscan.nmaposrate": 5,
    "portscan.lograte": 3600,
    "smb.auditfile": "/var/log/opencanary/samba_audit.log",
    "smb.enabled": false,
    "mysql.enabled": false,
    "ssh.enabled": false,
    "redis.enabled": false,
    "rdp.enabled": false,
    "sip.enabled": false,
    "snmp.enabled": false,
    "ntp.enabled": false,
    "tftp.enabled": false,
    "tcpbanner.enabled": false,
    "telnet.enabled": false,
    "mssql.enabled": false,
    "vnc.enabled": false,
    "modbus.enabled": false,
    "sip.enabled": false
}
