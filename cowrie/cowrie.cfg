# Cowrie Honeypot Configuration
# Multi-Protocol Honeypot - SSH & Telnet Emulation

[honeypot]
# Hostname presented to attackers
hostname = srv-prod-01
# Log file for text logging
log_path = var/log/cowrie
# Download path for malware samples
download_path = var/downloads
# Share path for file emulation
share_path = share/cowrie
# Contents path for fake file system
contents_path = honeyfs
# TTY logging
ttylog_path = var/tty
# Interactive timeout (0 = no timeout)
interactive_timeout = 180
# Backend for authentication (allowing all logins for honeypot)
backend = shell

# SSH Configuration
[ssh]
enabled = true
# Port to listen on (internal)
listen_endpoints = tcp:2222:interface=0.0.0.0
# SSH version string
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.1
# Forward traffic
forwarding = false
# Allow port forwarding
forward_redirect = false

# Telnet Configuration
[telnet]
enabled = true
# Port to listen on (internal)
listen_endpoints = tcp:2323:interface=0.0.0.0
# Prompt
prompt = ubuntu-server login:

# Output Plugins Configuration
[output_jsonlog]
# Enable JSON logging
enabled = true
logfile = var/log/cowrie/cowrie.json
epoch_timestamp = false

[output_textlog]
# Enable text logging
enabled = true
logfile = var/log/cowrie/cowrie.log

# MySQL/Database logging (disabled for MVP)
[output_mysql]
enabled = false

# Elasticsearch output (disabled - using Filebeat)
[output_elasticsearch]
enabled = false

# File download settings
[download]
# Max file size to download (10MB)
max_size = 10485760

# Shell Configuration
[shell]
# Filesystem to emulate
filesystem = share/cowrie/fs.pickle
# Process list
processes = share/cowrie/processes.pickle
# Prompt format
prompt = {username}@{hostname}:~$
# Architecture
arch = linux-x64-lsb

# Authentication
[backend_pool]
# Allow all authentication attempts (for honeypot purposes)
save_passwords = true
